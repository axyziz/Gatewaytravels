<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoices | Gateway Travels CRM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h2{
    margin-bottom:20px;
    color:#0B3D91;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

#searchInvoice{
    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#2563eb;
    color:#fff;
}

button:hover{
    background:#1d4ed8;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f7f7f7;
}

</style>

</head>

<body>

<div class="container">

<h2>Gateway Travels Invoices</h2>

<div class="topbar">

<input
    type="text"
    id="searchInvoice"
    placeholder="Search Invoice">

<button onclick="window.location='create-invoice.html'">

+ New Invoice

</button>

</div>

<table>

<thead>

<tr>

<th>Invoice</th>
<th>Customer</th>
<th>Service</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="invoiceTable">

<tr>

<td colspan="6" align="center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

<script src="../assets/js/invoices.js"></script>

</body>

</html>
