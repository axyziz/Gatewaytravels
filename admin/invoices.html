<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices | Gateway Travels</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#182230;margin:0;padding:24px}
.container{max-width:1240px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;color:#0b3d91;margin:0 0 6px}.subtitle{color:#64748b;margin:0}
.nav,.toolbar,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav{margin:18px 0;background:#fff;padding:12px;border:1px solid #e2e8f0;border-radius:12px}
button,.nav a{border:0;border-radius:8px;padding:10px 13px;background:#0b3d91;color:white;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
button:hover,.nav a:hover{background:#082e6d}
button.secondary,.nav a.secondary{background:#e8eef8;color:#17345f}button.secondary:hover,.nav a.secondary:hover{background:#d7e2f3}
button.danger{background:#b91c1c}button.danger:hover{background:#991b1b}button.download{background:#087443}button.download:hover{background:#065f36}
.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.toolbar{justify-content:space-between;margin-bottom:14px}
#searchInvoice{width:min(100%,360px);padding:11px 13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.table-wrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:850px;background:#fff}
th{background:#0b3d91;color:white;text-align:left;padding:13px;font-size:13px}
td{padding:12px;border-bottom:1px solid #e8edf4;font-size:14px}tbody tr:hover{background:#f8fafc}
.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}
.status.paid{background:#dcfce7;color:#166534}.status.pending{background:#fef3c7;color:#92400e}
.actions button{padding:8px 10px;font-size:13px}
.empty{text-align:center;padding:26px;color:#64748b}
@media(max-width:600px){body{padding:12px}header{align-items:flex-start}h1{font-size:22px}.nav a{flex:1}.card{padding:12px}}
</style>
</head>
<body>
<div class="container">
<header>
<div><h1>Gateway Travels &amp; Holidays</h1><p class="subtitle">Invoice management</p></div>
<button onclick="window.location.href='create-invoice.html'">＋ New Invoice</button>
</header>
<nav class="nav" aria-label="Admin navigation">
<a class="secondary" href="dashboard.html">← Dashboard</a>
<a href="create-invoice.html">Create Invoice</a>
<a href="invoices.html">View Invoices</a>
<a class="secondary" href="customers.html">Customers</a>
<a class="secondary" href="https://axyziz.github.io/Gatewaytravels/" target="_blank" rel="noopener">Website ↗</a>
<button class="secondary" onclick="history.back()">Back</button>
<button class="secondary" onclick="history.forward()">Forward</button>
</nav>
<section class="card">
<div class="toolbar">
<div><strong>Invoices</strong><p class="subtitle">Edit, delete, or download a PDF directly from this list.</p></div>
<input id="searchInvoice" type="search" placeholder="Search invoice, customer, service…">
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Invoice</th><th>Customer</th><th>Service</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="invoiceTable"><tr><td colspan="6" class="empty">Loading invoices…</td></tr></tbody>
</table>
</div>
</section>
</div>
<script src="../assets/js/invoices.js"></script>
</body>
</html>
