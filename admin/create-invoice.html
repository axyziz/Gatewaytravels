<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Invoice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
:root{--navy:#12345a;--blue:#245b91;--ink:#172b42;--muted:#65758a;--line:#dce5ee;--bg:#f2f6fa;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.container{width:min(1120px,94%);margin:28px auto 48px;background:transparent;border-radius:0;padding:0;box-shadow:none}
.admin-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;padding:14px 18px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #193c5a0a}
.brand{font-weight:800;color:var(--navy);letter-spacing:.1px}.nav-links{display:flex;gap:8px;flex-wrap:wrap}.nav-links a,.mini-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:#fff;color:#42566e;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}.nav-links a.active,.mini-btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.page-heading{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:0 0 20px}.page-heading h1{margin:0;font-size:clamp(25px,3vw,34px);color:var(--navy);letter-spacing:-.8px}.page-heading p{margin:7px 0 0;color:var(--muted);font-size:14px}
.section{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin:0 0 16px;box-shadow:0 5px 18px #193c5a08}
.section h3{margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #edf1f5;color:var(--navy);font-size:16px}
label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700;color:#42566e}
input,select,textarea{width:100%;padding:12px 13px;margin:0;border:1px solid #d4deea;border-radius:9px;background:#fbfdff;color:var(--ink);font:inherit;font-size:14px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a83b7;box-shadow:0 0 0 3px #245b911a;background:#fff}
input[readonly]{background:#f0f4f8;color:#5c6d80}textarea{resize:vertical;min-height:100px}
.button-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.button-group button{width:auto;flex:1;min-width:145px;padding:12px 16px;border:1px solid transparent;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:750;cursor:pointer}.button-group button:hover{filter:brightness(1.08)}.button-group .secondary{background:#fff;border-color:var(--line);color:var(--navy)}.button-group .success{background:#217a59}
#status{margin:16px 0;text-align:center;font-weight:700;color:#217a59}
@media(min-width:760px){.section{padding:24px 26px}.section:has(#invoice_number),.section:has(#service),.section:has(#amount){display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start}.section h3{grid-column:1/-1}.section label{margin-top:4px}.section input,.section select,.section textarea{margin-bottom:12px}}
@media(max-width:600px){.container{width:94%;margin-top:14px}.section{padding:17px}.admin-nav{align-items:flex-start}.nav-links a{padding:8px 9px}.button-group{flex-direction:column}.button-group button{width:100%}}
</style>

</head>

<body>

<div class="container">
<nav class="admin-nav"><div class="brand">Gateway Travels <span style="font-weight:500;color:#65758a">&nbsp; / Admin</span></div><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="create-invoice.html">Create Invoice</a><a href="invoices.html">View Invoices</a><a href="customers.html">Customers</a></div></nav>
<div class="page-heading"><div><h1>Create invoice</h1><p>Prepare and manage customer bookings in one place.</p></div><a class="mini-btn" href="invoices.html">← Back to invoices</a></div>





<div class="section">

<h3>📄 Invoice Information</h3>

<label>Invoice Number</label>

<input id="invoice_number" placeholder="Invoice Number" readonly>

<label>Select Customer</label>

<select id="customer_id">
    <option value="">Select Customer</option>
</select>

</div>


<div class="section">

<h3>👤 Customer Information</h3>

<label>Customer Name</label>

<input id="customer_name" placeholder="Customer Name" readonly>

<label>Mobile Number</label>

<input id="customer_mobile" placeholder="Customer Mobile" readonly>

<label>Email Address</label>

<input id="customer_email" placeholder="Customer Email" readonly>

</div>

<div class="section">

<h3>✈️ Booking Information</h3>

<label>Service</label>

<select id="service">
    <option>Flight</option>
    <option>Bus</option>
    <option>Hotel</option>
    <option>Visa</option>
    <option>Holiday Package</option>
    <option>Vehicle Rental</option>
</select>

<label>Description</label>

<textarea
id="description"
placeholder="Enter booking details, route, hotel name, visa type, package details, etc."></textarea>

</div>

<div class="section">

<h3>💰 Payment Summary</h3>

<label>Amount (₹)</label>

<input
id="amount"
type="number"
placeholder="Enter Amount"
oninput="calculateTotal()">

<label>Discount (₹)</label>

<input
id="discount"
type="number"
placeholder="Enter Discount"
oninput="calculateTotal()">

<label>Grand Total (₹)</label>

<input
id="total"
type="number"
placeholder="Total Amount"
readonly>

<label>Payment Status</label>

<select id="payment_status">
    <option>Pending</option>
    <option>Paid</option>
</select>

<label>Payment Method</label>

<input
id="payment_method"
placeholder="Cash / UPI / Card / Bank Transfer">

</div>
    <div class="section">

<h3>📋 Terms & Conditions</h3>

<label>Terms & Conditions</label>

<textarea
id="terms"
placeholder="Enter booking-specific terms and conditions..."></textarea>

</div>

<div class="button-group">

<button
class="primary"
onclick="saveInvoice()">
💾 Save Invoice
</button>

<button
type="button"
class="secondary"
onclick="window.print()">
🖨 Print Invoice
</button>

<button
type="button"
class="success"
onclick="downloadInvoicePDF()">
📄 Download PDF
</button>

</div>

<p id="status"></p>

</div>

<script>
async function generateInvoiceNumber() {

    const { data, error } = await supabaseClient
        .from("invoices")
        .select("invoice_number")
        .order("created_at", { ascending: false })
        .limit(1);

    if (error) {
        console.error(error);
        return;
    }

    let nextNumber = 1;

    if (data.length > 0) {
        const lastInvoice = data[0].invoice_number;
        const number = parseInt(lastInvoice.replace("GT-", ""));
        nextNumber = number + 1;
    }

    document.getElementById("invoice_number").value =
        "GT-" + String(nextNumber).padStart(4, "0");
}

function calculateTotal() {

    const amount = Number(document.getElementById("amount").value) || 0;

    const discount = Number(document.getElementById("discount").value) || 0;

    document.getElementById("total").value = amount - discount;

}

async function saveInvoice() {

    alert("saveInvoice() started");

    const invoice = {

        customer_id: document.getElementById("customer_id").value,

        customer_name: document.getElementById("customer_name").value,

        customer_mobile: document.getElementById("customer_mobile").value,

        customer_email: document.getElementById("customer_email").value,

        service: document.getElementById("service").value,

        description: document.getElementById("description").value,

        amount: document.getElementById("amount").value,

        discount: document.getElementById("discount").value,

        total: document.getElementById("total").value,

        payment_status: document.getElementById("payment_status").value,

        payment_method: document.getElementById("payment_method").value,
        terms: document.getElementById("terms").value,

    };

    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get("id");

    console.log("Invoice ID:", invoiceId);
    console.log("Invoice:", invoice);

    let error;

    if (invoiceId) {

        alert("Updating Invoice...");

        ({ error } = await supabaseClient
            .from("invoices")
            .update(invoice)
            .eq("id", invoiceId));

    } else {

        alert("Creating New Invoice...");

        invoice.invoice_number =
            document.getElementById("invoice_number").value;

        ({ error } = await supabaseClient
            .from("invoices")
            .insert([invoice]));

    }

    if (error) {

        console.error(error);

        alert(error.message);

        document.getElementById("status").innerHTML = error.message;

        return;

    }

    alert("Invoice Saved Successfully");

    document.getElementById("status").innerHTML =
        "✅ Invoice Saved Successfully";

    setTimeout(() => {

        window.location.href = "invoices.html";

    }, 1000);

}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script src="../assets/js/invoice.js"></script>
    
</body>
</html>
