<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Invoice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
}

.container{
    max-width:1000px;
    width:90%;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}


.company-info{
    flex:1;
    padding-left:20px;
}

.company-info h1{
    margin:0;
    color:#0B3D91;
    font-size:32px;
}

.company-info p{
    margin:5px 0;
    color:#555;
}
.header h1{
    margin:0;
    color:#0B3D91;
    font-size:32px;
}

.header p{
    margin:4px 0;
    color:#555;
}

hr{
    border:none;
    border-top:2px solid #0B3D91;
    margin:20px 0;
}

h2{
    margin-bottom:20px;
    color:#0B3D91;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #d1d5db;
    border-radius:8px;
    box-sizing:border-box;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

.section{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    background:#fafafa;
}

.section h3{
    margin:0 0 15px;
    color:#0B3D91;
    font-size:18px;
    border-bottom:1px solid #e5e7eb;
    padding-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

@media (max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

#status{
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>

<body onload="generateInvoiceNumber()">

<div class="header">


    <div class="company-info">

        <h1>Gateway Travels & Holidays</h1>

        <p>Your Journey, Our Passion</p>

        <p>
            📞 +91 73829 64554<br>
            ✉ gatewaytravelsandholidays@gmail.com
        </p>

    </div>

</div>

<hr>

<h2>Create Invoice</h2>

<div class="section">
    <h3>📄 Invoice Information</h3>

    <input id="invoice_number" placeholder="Invoice Number" readonly>

    <select id="payment_status">
        <option>Pending</option>
        <option>Paid</option>
    </select>
</div>

<div class="section">
    <h3>👤 Customer Details</h3>

    <input id="customer_name" placeholder="Customer Name">

    <input id="customer_mobile" placeholder="Customer Mobile">

    <input id="customer_email" placeholder="Customer Email">
</div>

<div class="section">
    <h3>✈️ Booking Details</h3>

    <select id="service">
        <option>Flight</option>
        <option>Bus</option>
        <option>Hotel</option>
        <option>Visa</option>
        <option>Holiday Package</option>
        <option>Vehicle Rental</option>
    </select>

    <textarea id="description" placeholder="Description"></textarea>
</div>

<div class="section">
    <h3>💳 Payment Summary</h3>

    <input id="amount" type="number" placeholder="Amount" oninput="calculateTotal()">

    <input id="discount" type="number" placeholder="Discount" oninput="calculateTotal()">

    <input id="total" type="number" placeholder="Grand Total" readonly>

    <input id="payment_method" placeholder="Payment Method">
</div>

<button onclick="saveInvoice()">Save Invoice</button>

<button onclick="downloadPDF()" style="background:#16a34a;">
    Download PDF
</button>

<p id="status"></p>
</div>

<script>
async function generateInvoiceNumber() {

    const { data, error } = await supabaseClient
        .from("invoices")
        .select("invoice_number")
        .order("created_at", { ascending: false })
        .limit(1);

    if (error) {
        console.error(error);
        return;
    }

    let nextNumber = 1;

    if (data.length > 0) {
        const lastInvoice = data[0].invoice_number;
        const number = parseInt(lastInvoice.replace("GT-", ""));
        nextNumber = number + 1;
    }

    document.getElementById("invoice_number").value =
    
        "GT-" + String(nextNumber).padStart(4, "0");
    }
   function calculateTotal() {

    const amount = Number(document.getElementById("amount").value) || 0;

    const discount = Number(document.getElementById("discount").value) || 0;

    document.getElementById("total").value = amount - discount;

}
function downloadPDF() {

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    doc.setFontSize(20);
    doc.text("Gateway Travels & Holidays", 20, 20);

    doc.setFontSize(12);
    doc.text("Invoice Number: " + document.getElementById("invoice_number").value, 20, 40);
    doc.text("Customer: " + document.getElementById("customer_name").value, 20, 50);
    doc.text("Mobile: " + document.getElementById("customer_mobile").value, 20, 60);
    doc.text("Service: " + document.getElementById("service").value, 20, 70);
    doc.text("Amount: ₹" + document.getElementById("amount").value, 20, 80);
    doc.text("Discount: ₹" + document.getElementById("discount").value, 20, 90);
    doc.text("Total: ₹" + document.getElementById("total").value, 20, 100);

    doc.save(document.getElementById("invoice_number").value + ".pdf");
}
async function saveInvoice() {

const {error}=await supabaseClient
.from("invoices")
.insert([{

invoice_number:document.getElementById("invoice_number").value,

customer_name:document.getElementById("customer_name").value,

customer_mobile:document.getElementById("customer_mobile").value,

customer_email:document.getElementById("customer_email").value,

service:document.getElementById("service").value,

description:document.getElementById("description").value,

amount:document.getElementById("amount").value,

discount:document.getElementById("discount").value,

total:document.getElementById("total").value,

payment_status:document.getElementById("payment_status").value,

payment_method:document.getElementById("payment_method").value

}]);


if(error){

document.getElementById("status").innerHTML=error.message;

}else{

document.getElementById("status").innerHTML="✅ Invoice Saved Successfully";

}

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
