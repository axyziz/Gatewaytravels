<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Invoice | Gateway Travels</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#1f2937;margin:0;padding:22px}
.container{width:100%;max-width:960px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:26px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
h1{font-size:25px;color:#0b3d91;margin:0 0 6px}.subtitle{color:#64748b;margin:0 0 22px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav a,.nav button{border:0;border-radius:8px;padding:10px 13px;background:#e8eef8;color:#17345f;text-decoration:none;cursor:pointer;font-size:14px}.nav a.primary{background:#0b3d91;color:white}
.section{border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:16px 0;background:#fff}
.section h2{font-size:16px;color:#0b3d91;margin:0 0 14px}
label{display:block;font-weight:600;font-size:13px;color:#334155;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:white;color:#1f2937}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#2563eb}
textarea{min-height:120px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.buttons button{flex:1;min-width:150px;border:0;border-radius:9px;padding:13px;background:#0b3d91;color:white;font-weight:600;cursor:pointer}.buttons .secondary{background:#e8eef8;color:#17345f}.buttons .success{background:#087443}
#status{margin-top:15px;color:#087443;font-weight:600}
@media(max-width:640px){body{padding:10px}.container{padding:16px}.grid{grid-template-columns:1fr}.nav a,.nav button{flex:1;text-align:center}.buttons{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<h1>Gateway Travels &amp; Holidays</h1><p class="subtitle">Create and manage customer invoices</p>
<nav class="nav" aria-label="Admin navigation">
<a href="dashboard.html">← Dashboard</a><a class="primary" href="create-invoice.html">Create Invoice</a><a href="invoices.html">View Invoices</a><a href="customers.html">Customers</a><a href="https://axyziz.github.io/Gatewaytravels/" target="_blank" rel="noopener">Website ↗</a>
<button type="button" onclick="history.back()">Back</button><button type="button" onclick="history.forward()">Forward</button>
</nav>
<div class="section"><h2>Invoice Information</h2><div class="grid">
<div><label for="invoice_number">Invoice Number</label><input id="invoice_number" placeholder="Invoice Number" readonly></div>
<div><label for="customer_id">Select Customer</label><select id="customer_id"><option value="">Select Customer</option></select></div>
</div></div>
<div class="section"><h2>Customer Information</h2><div class="grid">
<div><label for="customer_name">Customer Name</label><input id="customer_name" placeholder="Customer Name" readonly></div>
<div><label for="customer_mobile">Mobile Number</label><input id="customer_mobile" placeholder="Customer Mobile" readonly></div>
<div><label for="customer_email">Email Address</label><input id="customer_email" placeholder="Customer Email" readonly></div>
</div></div>
<div class="section"><h2>Booking Information</h2>
<label for="service">Service</label><select id="service"><option>Flight</option><option>Bus</option><option>Hotel</option><option>Visa</option><option>Holiday Package</option><option>Vehicle Rental</option></select>
<label for="description">Booking Details / Description</label><textarea id="description" placeholder="Enter route, travel dates, booking reference, hotel, visa, or package details"></textarea>
</div>
<div class="section"><h2>Payment Summary</h2><div class="grid">
<div><label for="amount">Amount (₹)</label><input id="amount" type="number" placeholder="Enter amount" oninput="calculateTotal()"></div>
<div><label for="discount">Discount (₹)</label><input id="discount" type="number" placeholder="Enter discount" oninput="calculateTotal()"></div>
<div><label for="total">Grand Total (₹)</label><input id="total" type="number" placeholder="Total amount" readonly></div>
<div><label for="payment_status">Payment Status</label><select id="payment_status"><option>Pending</option><option>Paid</option></select></div>
</div><label for="payment_method">Payment Method</label><input id="payment_method" placeholder="Cash / UPI / Card"></div>
<div class="section"><h2 id="termsHeading">Terms &amp; Conditions</h2><label for="terms">Service-specific terms (editable)</label><textarea id="terms" placeholder="Select a service to load its terms and conditions"></textarea></div>
<div class="buttons"><button onclick="saveInvoice()">Save Invoice</button><button type="button" class="secondary" onclick="window.print()">Print</button><button type="button" class="success" onclick="downloadInvoicePDF()">Download PDF</button></div>
<p id="status" role="status"></p>
</div>

<script>
function calculateTotal() {
  const amount = Number(document.getElementById("amount").value) || 0;
  const discount = Number(document.getElementById("discount").value) || 0;
  document.getElementById("total").value = Math.max(0, amount - discount).toFixed(2);
}
async function saveInvoice() {
  const customerId = document.getElementById("customer_id").value;
  if (!customerId) { alert("Please select a customer."); return; }
  const invoice = {
    customer_id: customerId,
    customer_name: document.getElementById("customer_name").value,
    customer_mobile: document.getElementById("customer_mobile").value,
    customer_email: document.getElementById("customer_email").value,
    service: document.getElementById("service").value,
    description: document.getElementById("description").value,
    amount: Number(document.getElementById("amount").value) || 0,
    discount: Number(document.getElementById("discount").value) || 0,
    total: Number(document.getElementById("total").value) || 0,
    payment_status: document.getElementById("payment_status").value,
    payment_method: document.getElementById("payment_method").value,
    terms: document.getElementById("terms").value
  };
  const params = new URLSearchParams(window.location.search);
  const invoiceId = params.get("id");
  const status = document.getElementById("status");
  status.textContent = "Saving invoice…";
  let result;
  if (invoiceId) {
    result = await supabaseClient.from("invoices").update(invoice).eq("id", invoiceId);
  } else {
    invoice.invoice_number = document.getElementById("invoice_number").value;
    result = await supabaseClient.from("invoices").insert([invoice]);
  }
  if (result.error) {
    console.error(result.error);
    status.textContent = "Could not save invoice: " + result.error.message;
    return;
  }
  status.textContent = "Invoice saved successfully.";
  if (!invoiceId) {
    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("discount").value = "";
    document.getElementById("total").value = "";
    window.setTimeout(() => { window.location.href = "invoices.html"; }, 900);
  }
}
</script>

<script src="../assets/js/invoice.js?v=20261024-shortterms"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="../assets/js/invoice-pdf-new.js?v=20261024-bankrestore"></script>
</body>
</html>
