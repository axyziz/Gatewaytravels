<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Invoice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#eef3f8;
    color:#1f2937;
}

.container{
    width:95%;
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:16px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    color:#0B3D91;
    font-size:32px;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:12px 14px;
    margin:10px 0;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

textarea{
    resize:vertical;
    min-height:90px;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

#status{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
    color:#16a34a;
}
</style>

</head>

<body>

<div class="container">

<h2>Create Invoice</h2>

<input id="invoice_number" placeholder="Invoice Number" readonly>

<select id="customer_id">
    <option value="">Select Customer</option>
</select>

<input id="customer_name" placeholder="Customer Name" readonly>

<input id="customer_mobile" placeholder="Customer Mobile" readonly>

<input id="customer_email" placeholder="Customer Email" readonly>

<select id="service">
<option>Flight</option>
<option>Bus</option>
<option>Hotel</option>
<option>Visa</option>
<option>Holiday Package</option>
<option>Vehicle Rental</option>
</select>

<textarea id="description" placeholder="Description"></textarea>

<input id="amount" type="number" placeholder="Amount" oninput="calculateTotal()">

<input id="discount" type="number" placeholder="Discount" oninput="calculateTotal()">

<input id="total" type="number" placeholder="Total" readonly>

<select id="payment_status">
<option>Pending</option>
<option>Paid</option>
</select>

<input id="payment_method" placeholder="Payment Method">

<button onclick="saveInvoice()">
Save Invoice
</button>

<p id="status"></p>

</div>

<script>
async function generateInvoiceNumber() {

    const { data, error } = await supabaseClient
        .from("invoices")
        .select("invoice_number")
        .order("created_at", { ascending: false })
        .limit(1);

    if (error) {
        console.error(error);
        return;
    }

    let nextNumber = 1;

    if (data.length > 0) {
        const lastInvoice = data[0].invoice_number;
        const number = parseInt(lastInvoice.replace("GT-", ""));
        nextNumber = number + 1;
    }

    document.getElementById("invoice_number").value =
        "GT-" + String(nextNumber).padStart(4, "0");
}

function calculateTotal() {

    const amount = Number(document.getElementById("amount").value) || 0;

    const discount = Number(document.getElementById("discount").value) || 0;

    document.getElementById("total").value = amount - discount;

}

async function saveInvoice() {

    alert("saveInvoice() started");

    const invoice = {

        customer_id: document.getElementById("customer_id").value,

        customer_name: document.getElementById("customer_name").value,

        customer_mobile: document.getElementById("customer_mobile").value,

        customer_email: document.getElementById("customer_email").value,

        service: document.getElementById("service").value,

        description: document.getElementById("description").value,

        amount: document.getElementById("amount").value,

        discount: document.getElementById("discount").value,

        total: document.getElementById("total").value,

        payment_status: document.getElementById("payment_status").value,

        payment_method: document.getElementById("payment_method").value

    };

    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get("id");

    console.log("Invoice ID:", invoiceId);
    console.log("Invoice:", invoice);

    let error;

    if (invoiceId) {

        alert("Updating Invoice...");

        ({ error } = await supabaseClient
            .from("invoices")
            .update(invoice)
            .eq("id", invoiceId));

    } else {

        alert("Creating New Invoice...");

        invoice.invoice_number =
            document.getElementById("invoice_number").value;

        ({ error } = await supabaseClient
            .from("invoices")
            .insert([invoice]));

    }

    if (error) {

        console.error(error);

        alert(error.message);

        document.getElementById("status").innerHTML = error.message;

        return;

    }

    alert("Invoice Saved Successfully");

    document.getElementById("status").innerHTML =
        "✅ Invoice Saved Successfully";

    setTimeout(() => {

        window.location.href = "invoices.html";

    }, 1000);

}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="../assets/js/invoice.js"></script>

</body>
</html>
