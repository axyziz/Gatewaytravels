<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Travels Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f4f7fc;
    margin:0;
}

/* Header */

header{
    background:#0A3D91;
    color:white;
    padding:22px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

header h2{
    margin:0;
    font-size:30px;
    font-weight:700;
}

.admin-profile{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,.15);
    padding:10px 18px;
    border-radius:12px;
}

.admin-profile i{
    font-size:28px;
}

/* Main */

.container{
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.card{
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

    /* Dashboard Cards */

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
    margin-top:30px;
}

.dashboard-card{
    background:#ffffff;
    border-radius:18px;
    padding:35px 25px;
    text-align:center;
    cursor:pointer;
    transition:all .3s ease;
    border:1px solid #e5e7eb;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.dashboard-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 40px rgba(10,61,145,.18);
    border-color:#0A3D91;
}

.dashboard-card i{
    font-size:52px;
    color:#0A3D91;
    margin-bottom:18px;
}

.dashboard-card h3{
    margin:10px 0;
    font-size:22px;
    color:#1f2937;
}

.dashboard-card p{
    color:#6b7280;
    font-size:15px;
    margin:0;
}

.logout-card i{
    color:#dc2626;
}

.logout-card:hover{
    border-color:#dc2626;
    box-shadow:0 20px 40px rgba(220,38,38,.18);
}
</style>

</head>

<body onload="checkLogin()">

<header>

<h2>Gateway Travels Admin Dashboard</h2>

<div class="admin-profile">
    <i class="fa-solid fa-circle-user"></i>

    <div>
        <strong>Admin</strong><br>
        <small>Gateway Travels</small>
    </div>
</div>

</header>

<div class="container">

<div class="card">

<h1>Gateway Travels Admin</h1>

<h1 style="margin-top:0;">Welcome Back 👋</h1>

<p style="color:#666;margin-bottom:35px;">
Manage your travel business from one place.
</p>

<div class="dashboard-grid">

    <div class="dashboard-card"
         onclick="location.href='create-invoice.html'">

        <i class="fa-solid fa-file-circle-plus"></i>

        <h3>Create Invoice</h3>

        <p>Generate professional invoices</p>

    </div>

    <div class="dashboard-card"
         onclick="location.href='invoices.html'">

        <i class="fa-solid fa-file-lines"></i>

        <h3>View Invoices</h3>

        <p>Manage all saved invoices</p>

    </div>

    <div class="dashboard-card"
         onclick="location.href='customers.html'">

        <i class="fa-solid fa-users"></i>

        <h3>Customers</h3>

        <p>Manage customer records</p>

    </div>

    <div class="dashboard-card logout-card"
         onclick="logout()">

        <i class="fa-solid fa-right-from-bracket"></i>

        <h3>Logout</h3>

        <p>Sign out securely</p>

    </div>

</div>

</div>

<script>
async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
