<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Invoice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

</head>

<body>

<div class="invoice-container">

    <div class="invoice">

        <div class="header">

            <h1>Gateway Travels & Holidays</h1>

            <p>Your Journey, Our Passion</p>

            <h2>TAX INVOICE</h2>

        </div>

        <hr>

        <div class="invoice-info">

            <p>
                <strong>Invoice No:</strong>
                <span id="invoice_number"></span>
            </p>

            <p>
                <strong>Date:</strong>
                <span id="invoice_date"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="payment_status"></span>
            </p>

        </div>

        <hr>

        <div class="customer">

            <h3>Bill To</h3>

            <p id="customer_name"></p>

            <p id="customer_mobile"></p>

            <p id="customer_email"></p>

        </div>

        <hr>

        <div class="service">

            <h3>Service Details</h3>

            <p>
                <strong>Service:</strong>
                <span id="service"></span>
            </p>

            <p id="description"></p>

        </div>

        <hr>

        <table width="100%">

            <tr>

                <td>Subtotal</td>

                <td align="right">
                    ₹<span id="amount"></span>
                </td>

            </tr>

            <tr>

                <td>Discount</td>

                <td align="right">
                    ₹<span id="discount"></span>
                </td>

            </tr>

            <tr>

                <td>
                    <strong>Grand Total</strong>
                </td>

                <td align="right">
                    <strong>₹<span id="total"></span></strong>
                </td>

            </tr>

        </table>

        <hr>

        <p>
            <strong>Payment Method:</strong>
            <span id="payment_method"></span>
        </p>

        <br><br>

        <center>

            <p>Thank you for choosing</p>

            <h3>Gateway Travels & Holidays</h3>

            <p>📞 +91 73829 64554</p>

            <p>✉ gatewaytravelsandholidays@gmail.com</p>

        </center>

    </div>

</div>

</body>

</html>
